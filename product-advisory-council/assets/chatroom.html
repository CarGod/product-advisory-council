<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>产品顾问团 · 群聊</title>
<style>
:root{
  --ground:#F1F3EF; --surface:#FFFFFF; --surface-2:#F7F8F5; --ink:#1E2320; --ink-2:#4B534E; --ink-3:#7C857F;
  --line:#DDE1DA; --seal:#B5341F; --seal-ink:#FFFFFF; --focus:#1F7F8C; --mix:white;
  --shadow:0 1px 2px rgba(30,35,32,.05), 0 10px 30px rgba(30,35,32,.07);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --ground:#131614; --surface:#1C201D; --surface-2:#232824; --ink:#E9ECE7; --ink-2:#B7BEB8; --ink-3:#858D87;
    --line:#2F3531; --seal:#D4553D; --seal-ink:#FFFFFF; --focus:#58B7C4; --mix:black; --shadow:none; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:inherit}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 312px;grid-template-rows:auto auto minmax(0,1fr) auto}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .group{width:42px;height:42px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line);background:var(--surface-2)}
.bar .group img{width:100%;height:100%;display:block}
.bar h1{margin:0;font:600 17px/1.3 var(--serif);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.depth-badge{font:inherit;font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:2px 9px;cursor:pointer;margin-top:3px}
.bar .titles{min-width:0;flex:1}
.tag{display:inline-block;padding:0 7px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;line-height:18px;color:var(--ink-2);white-space:nowrap}
.tag.sim{border-color:var(--seal);color:var(--seal)}
.tag.live{border-color:#3F8F5A;color:#3F8F5A}
.tag.away{border-color:var(--ink-3);color:var(--ink-3)}
.stack{display:flex;flex:none}
.stack .face{width:30px;height:30px;margin-left:-8px;border:2px solid var(--surface)}
.barbtn{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-2);background:var(--surface)}
.barbtn:hover{border-color:var(--ink-3);color:var(--ink)}
#membersBtn{display:none}

.notice{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;padding:8px 20px;background:color-mix(in srgb,var(--seal) 7%,var(--surface));border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.notice b{flex:none;color:var(--seal);font-weight:600}
.notice p{margin:0;flex:1}
.notice.folded p{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.notice button{flex:none;color:var(--ink-3);font-size:12px}

.stream{grid-column:1;grid-row:3;overflow-y:auto;padding:20px 20px 28px;scroll-behavior:smooth;overscroll-behavior:contain}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.day{align-self:center;font-size:12px;color:var(--ink-3);padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 5%,transparent)}

.face{position:relative;display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--surface-2)}
.face img{position:absolute;width:130%;height:130%;left:-15%;top:-5%;max-width:none}
.face.plain img{position:static;width:100%;height:100%}

.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg .avatar{width:40px;height:40px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--hue,var(--line))}
.msg .body{min-width:0;max-width:min(640px,100%);display:flex;flex-direction:column;gap:5px}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.meta .name{font-weight:600;font-size:13.5px;color:color-mix(in srgb,var(--hue,var(--ink)) 82%,var(--ink))}
.badge{font-size:10.5px;line-height:15px;padding:0 5px;border-radius:4px;border:1px solid color-mix(in srgb,var(--hue,var(--ink-3)) 45%,transparent);color:color-mix(in srgb,var(--hue,var(--ink-3)) 80%,var(--ink));letter-spacing:.02em}
.meta .kind{font-size:11.5px;color:var(--ink-3)}
.meta time{font-size:11.5px;color:var(--ink-3);opacity:.8}
.bubble{position:relative;align-self:flex-start;max-width:100%;padding:10px 14px;border-radius:4px 16px 16px 16px;background:color-mix(in srgb,var(--hue,var(--ink)) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--hue,var(--ink)) 20%,var(--line));overflow-wrap:anywhere}
.bubble p{margin:0}
.bubble p+p{margin-top:.55em}
.bubble strong{font-weight:650}
.quote{display:block;width:100%;margin:0 0 8px;padding:5px 9px;border-left:3px solid var(--qhue,var(--ink-3));border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--qhue,var(--ink)) 8%,transparent);font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.quote b{font-weight:600;color:color-mix(in srgb,var(--qhue,var(--ink)) 80%,var(--ink))}
.quote:hover{background:color-mix(in srgb,var(--qhue,var(--ink)) 14%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2)}
.chip:hover{border-color:color-mix(in srgb,var(--hue,var(--ink)) 55%,var(--line));color:var(--ink)}
.chip .cid,.inline-id{font:600 11.5px/1.6 var(--mono);color:color-mix(in srgb,var(--hue,var(--ink-2)) 85%,var(--ink))}
.chip .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inline-id{padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
button.inline-id:hover{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.at{font-weight:600;color:color-mix(in srgb,var(--athue,var(--seal)) 85%,var(--ink))}
.basis{font-size:11.5px;color:var(--ink-3)}
.basis::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;border:1.5px solid var(--ink-3);vertical-align:1px}
.replybtn{font-size:12px;color:var(--ink-3);opacity:0;transition:opacity .15s;padding:0 4px}
.msg:hover .replybtn,.replybtn:focus-visible{opacity:1}
.replybtn:hover{color:var(--ink)}
@media (hover:none){.replybtn{opacity:.75}}

.msg.user{flex-direction:row-reverse}
.msg.user .body{align-items:flex-end}
.msg.user .bubble{align-self:flex-end;border-radius:16px 4px 16px 16px;background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.msg.user .quote{background:rgba(255,255,255,.16);color:rgba(255,255,255,.92);border-left-color:rgba(255,255,255,.7)}
.msg.user .quote b{color:#fff}
.msg.user .at{color:#fff;text-decoration:underline;text-underline-offset:3px}
.msg.user .inline-id{background:rgba(255,255,255,.18);color:#fff}
.me{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--ground);font:600 14px var(--serif)}

.msg.host{display:block}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.card header{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2);background:var(--surface-2)}
.card header .face{width:22px;height:22px}
.card header b{font-weight:600;color:var(--ink)}
.card header time{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.card .inner{padding:12px 14px}
.card .inner p{margin:0}
.card .inner p+p{margin-top:.55em}
.card.decision{border-color:color-mix(in srgb,var(--seal) 45%,var(--line))}
.card.decision header{background:color-mix(in srgb,var(--seal) 8%,var(--surface));border-bottom-color:color-mix(in srgb,var(--seal) 25%,var(--line))}
.card.decision header b{color:var(--seal)}
.fields{margin:12px 0 0;display:grid;gap:10px}
.fields div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;padding-top:10px;border-top:1px dashed var(--line)}
.fields dt{font-size:12.5px;color:var(--ink-3)}
.fields dd{margin:0}
.msg.system,.msg.pass{align-self:center;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);text-align:center}
.msg.pass .face{width:20px;height:20px;filter:grayscale(.5);opacity:.85}

.typing{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.typing .face{width:28px;height:28px}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:rise .28s ease-out both}
.flash .bubble,.flash .card{animation:flash 1.4s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px color-mix(in srgb,var(--seal) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.enter,.flash .bubble,.flash .card,.dots i{animation:none}.stream{scroll-behavior:auto}}

.newpill{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;padding:6px 14px;border-radius:999px;background:var(--ink);color:var(--ground);font-size:12.5px;box-shadow:var(--shadow);z-index:3}
.streamwrap{grid-column:1;grid-row:3;position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.streamwrap .stream{grid-column:1;grid-row:1}

.side{grid-column:2;grid-row:3/5;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px}
.side h2{margin:0 0 10px;font:600 12.5px/1 var(--sans);letter-spacing:.08em;color:var(--ink-3)}
.side section+section{margin-top:22px}
.sideclose{display:none;float:right;margin:-4px 0 6px}
.member{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border-radius:12px}
.member:hover{background:var(--surface-2)}
.member .face{width:38px;height:38px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--hue)}
.member .who{min-width:0;flex:1}
.member .who div:first-child{display:flex;gap:6px;align-items:center;font-weight:600;font-size:13.5px}
.member .lens{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .count{font:11.5px var(--mono);color:var(--ink-3);flex:none}
.member.silent{opacity:.62}
.cardlist{display:grid;gap:4px}
.cardlist button{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;font-size:12.5px;color:var(--ink-2);width:100%}
.cardlist button:hover{background:var(--surface-2);color:var(--ink)}
.cardlist .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:12.5px;color:var(--ink-3)}

.composer{grid-column:1;grid-row:4;border-top:1px solid var(--line);background:var(--surface);padding:10px 20px calc(12px + env(safe-area-inset-bottom))}
.composer .inner{max-width:820px;margin:0 auto;position:relative}
.status{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:6px;min-height:18px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.status.on .dot{background:#3F8F5A}
.status.off{color:var(--seal)}
.status.off .dot{background:var(--seal)}
.replybar{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:5px 10px;border-left:3px solid var(--qhue,var(--ink-3));background:var(--surface-2);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink-2)}
.replybar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px;align-items:flex-end}
.row textarea{flex:1;resize:none;overflow-y:hidden;min-height:42px;max-height:160px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;line-height:1.5}
.row textarea::placeholder{color:var(--ink-3)}
.send{flex:none;height:42px;padding:0 18px;border-radius:12px;background:var(--seal);color:var(--seal-ink);font-weight:600}
.send:disabled{opacity:.45;cursor:default}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.quick button:hover{border-color:var(--ink-3);color:var(--ink)}
.menu{position:absolute;left:0;bottom:calc(100% + 6px);min-width:240px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);z-index:5}
.menu button{display:flex;gap:9px;align-items:center;width:100%;padding:6px 8px;border-radius:8px;font-size:13.5px}
.menu button[aria-selected="true"],.menu button:hover{background:var(--surface-2)}
.menu .face{width:26px;height:26px}
.menu small{color:var(--ink-3);font-size:11.5px;margin-left:auto}
.static-note{grid-column:1;grid-row:4;border-top:1px solid var(--line);background:var(--surface);padding:10px 20px;font-size:12.5px;color:var(--ink-3);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

.scrim{position:fixed;inset:0;background:rgba(15,18,16,.42);z-index:20;display:flex;justify-content:flex-end}
.sheet{width:min(440px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:20px;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .close{float:right;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.sheet h3{margin:6px 0 4px;font:600 19px/1.35 var(--serif)}
.sheet .idline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.sheet .idline code{font:600 12.5px var(--mono);color:color-mix(in srgb,var(--hue,var(--ink)) 85%,var(--ink))}
.sheet .claim{margin:14px 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--hue,var(--ink)) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--hue,var(--ink)) 20%,var(--line))}
.sheet h4{margin:18px 0 6px;font:600 12.5px var(--sans);letter-spacing:.06em;color:var(--ink-3)}
.sheet ul{margin:0;padding-left:1.2em}
.sheet li+li{margin-top:4px}
.src{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.src+.src{margin-top:8px}
.src .sid{font:600 12px var(--mono)}
.src a{display:block;margin-top:4px;font-size:12px;color:var(--focus);word-break:break-all}
.src .flag{display:inline-block;margin-top:6px;padding:0 6px;border-radius:4px;font-size:11.5px;background:color-mix(in srgb,var(--seal) 12%,transparent);color:var(--seal)}
.foot{margin-top:18px;font-size:12px;color:var(--ink-3)}
.profile{text-align:center}
.profile .face{width:132px;height:132px;margin:8px auto 12px;border-radius:28px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--hue)}
.profile .lensline{color:var(--ink-2)}

@media (max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 0 0 auto;width:min(340px,88%);z-index:15;transform:translateX(102%);transition:transform .22s ease-out;box-shadow:var(--shadow)}
  .side.open{transform:none}
  #membersBtn{display:inline-block}
  .sideclose{display:inline-block}
}
@media (max-width:640px){
  .bar{padding:10px 16px}.notice{padding:8px 16px}.stream{padding:16px 16px 22px}.composer{padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
  .msg .avatar,.me{width:34px;height:34px}
  .fields div{grid-template-columns:1fr;gap:2px}
  .scrim{align-items:flex-end}
  .sheet{width:100%;height:auto;max-height:86%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0}
  .quick{display:none}
  .stack{display:none}
}

.export-options{display:grid;gap:12px;margin:18px 0}
.export-options label{display:grid;gap:4px;font-size:13px}
.export-options select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.export-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.export-results{display:grid;gap:18px}.export-preview{margin:0;border:1px solid var(--line);border-radius:10px;padding:10px}.export-preview img{display:block;width:100%;height:auto;background:var(--ground)}
.export-preview figcaption{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-top:8px}
.export-status{font-size:13px;color:var(--ink-2);white-space:pre-line}
.export-stage{position:absolute;left:-10000px;top:0;width:540px;height:auto;overflow:visible;background:var(--ground);font:15px/1.65 var(--sans);color:var(--ink)}
.export-stage *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.export-stage .bar{padding:16px 20px}.export-stage .bar h1{white-space:normal;overflow:visible;text-overflow:clip;font-size:19px}
.export-stage .notice{padding:10px 20px}.export-stage .notice p{white-space:normal;overflow:visible}
.export-stage .col{padding:20px;width:540px;max-width:none;margin:0;gap:18px}
.export-stage .msg .body{max-width:calc(100% - 50px)}
.export-stage .msg .avatar,.export-stage .me{width:40px;height:40px}
.export-stage .fields div{grid-template-columns:1fr;gap:3px}
.export-stage .barbtn,.export-stage .stack,.export-stage .notice button,.export-stage .replybtn,.export-stage .typing{display:none!important}
.export-stage .basis::before{content:none}
@media(max-width:640px){.bar{gap:8px}.bar .group{width:34px;height:34px}.barbtn{padding:5px 8px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="group" id="groupFace"></span>
    <div class="titles">
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
      <button class="depth-badge" id="depthBadge" type="button" aria-label="讨论深度说明"></button>
    </div>
    <span class="stack" id="stack"></span>
    <button class="barbtn" id="exportBtn">导出长图</button>
    <button class="barbtn" id="replayBtn" hidden>回放</button>
    <button class="barbtn" id="membersBtn" aria-controls="side">成员</button>
  </header>
  <div class="notice folded" id="notice"><b>群公告</b><p id="noticeText"></p><button id="noticeBtn" aria-expanded="false">展开</button></div>
  <div class="streamwrap">
    <main class="stream" id="stream"><div class="col" id="col" aria-live="polite"></div></main>
    <button class="newpill" id="newpill" hidden></button>
  </div>
  <aside class="side" id="side" aria-label="群成员与引用">
    <button class="barbtn sideclose" id="sideClose">关闭</button>
    <section><h2>群成员</h2><div id="members"></div></section>
    <section><h2>本群引用的卡片</h2><div class="cardlist" id="cardlist"></div></section>
  </aside>
  <footer class="composer" id="composer" hidden>
    <div class="inner">
      <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div>
      <div class="replybar" id="replybar" hidden><span id="replyText"></span><button id="replyCancel" aria-label="取消回复">取消</button></div>
      <div class="menu" id="menu" role="listbox" hidden></div>
      <div class="row">
        <textarea id="input" rows="1" maxlength="2000" placeholder="在群里说点什么…  @ 可以点名某位顾问，Enter 发送，Shift+Enter 换行" aria-label="消息"></textarea>
        <button class="send" id="send" disabled>发送</button>
      </div>
      <div class="quick" id="quick"></div>
    </div>
  </footer>
  <div class="static-note" id="staticNote" hidden></div>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";
const DATA = /*__CHAT__*/null;
const LIVE = /*__LIVE__*/null;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const seats = new Map((DATA ? DATA.seats : []).map((s) => [s.slug, s]));
const byId = new Map();
const cards = DATA ? DATA.cards : {};
const ID_RE = /(?:SJ|YJ|ZXL|WX|LN)-[A-Z]?\d{2,3}/;
const TOKEN_RE = new RegExp("(\\*\\*[^*\\n]+\\*\\*)|(" + ID_RE.source + ")|(@(?:所有人|大家|全体|" + [...seats.values()].map((s) => s.name + "(?:视角)?").join("|") + "))", "g");
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastId = 0, lastDay = "", replyTo = null, queue = [], draining = false, presence = "offline", failures = 0, unseen = 0, seenId = 0;

function face(slug, cls, plain) {
  const f = el("span", "face" + (cls ? " " + cls : "") + (plain || slug === "council" ? " plain" : ""));
  const src = DATA.avatars[slug];
  if (src) { const img = el("img"); img.src = src; img.alt = ""; f.appendChild(img); }
  return f;
}
function who(slug) { return slug === "host" ? "主持人" : slug === "user" ? "你" : (seats.get(slug) || {name: slug}).name; }
function hue(slug) { const s = seats.get(slug); return s ? s.color : ""; }
function hhmm(at) { const m = /T(\d\d:\d\d)/.exec(at || ""); return m ? m[1] : ""; }
function day(at) {
  const d = new Date(at); if (isNaN(d)) return "";
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 周${"日一二三四五六"[d.getDay()]}`;
}
function snippet(text, n) { const t = text.replace(/\s+/g, " "); return t.length > n ? t.slice(0, n) + "…" : t; }

function rich(text, speaker) {
  const frag = document.createDocumentFragment();
  for (const para of text.split(/\n+/)) {
    const p = el("p"); let at = 0; TOKEN_RE.lastIndex = 0; let m;
    while ((m = TOKEN_RE.exec(para))) {
      if (m.index > at) p.appendChild(document.createTextNode(para.slice(at, m.index)));
      if (m[1]) p.appendChild(el("strong", "", m[1].slice(2, -2)));
      else if (m[2]) {
        if (cards[m[2]] && speaker !== "user") { const b = el("button", "inline-id", m[2]); b.type = "button"; b.addEventListener("click", () => openCard(m[2])); p.appendChild(b); }
        else p.appendChild(el("span", "inline-id", m[2]));
      } else {
        const span = el("span", "at", m[3]);
        const target = [...seats.values()].find((s) => m[3].slice(1).startsWith(s.name));
        if (target) span.style.setProperty("--athue", target.color);
        p.appendChild(span);
      }
      at = m.index + m[0].length;
    }
    if (at < para.length) p.appendChild(document.createTextNode(para.slice(at)));
    frag.appendChild(p);
  }
  return frag;
}

function quoteBlock(msg) {
  const target = byId.get(msg.reply_to); if (!target) return null;
  const q = el("button", "quote"); q.type = "button";
  q.style.setProperty("--qhue", hue(target.from) || "currentColor");
  q.appendChild(el("b", "", "回复 " + who(target.from) + "："));
  q.appendChild(document.createTextNode(snippet(target.text, 46)));
  q.addEventListener("click", () => jump(target.id));
  return q;
}
function jump(id) {
  const node = document.querySelector(`[data-id="${id}"]`); if (!node) return;
  node.scrollIntoView({block: "center", behavior: reduced ? "auto" : "smooth"});
  node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash");
}

function chipRow(msg) {
  const row = el("div", "chips");
  for (const id of msg.cards || []) {
    const c = cards[id]; const b = el("button", "chip"); b.type = "button";
    b.appendChild(el("span", "cid", id));
    b.appendChild(el("span", "ct", c ? c.title : ""));
    b.addEventListener("click", () => openCard(id));
    row.appendChild(b);
  }
  return row;
}

function render(msg) {
  byId.set(msg.id, msg);
  const d = day(msg.at);
  const out = [];
  if (d && d !== lastDay) { lastDay = d; out.push(el("div", "day", d)); }
  let node;
  if (msg.from === "host") node = renderHost(msg);
  else if (msg.kind === "pass") node = renderPass(msg);
  else node = renderBubble(msg);
  node.dataset.id = msg.id;
  out.push(node);
  return out;
}

function renderBubble(msg) {
  const mine = msg.from === "user";
  const node = el("article", "msg " + (mine ? "user" : "seat"));
  if (!mine) node.style.setProperty("--hue", hue(msg.from));
  if (mine) node.appendChild(el("span", "me", "你"));
  else { const a = el("button", "avatar face"); a.type = "button"; a.setAttribute("aria-label", "查看" + who(msg.from) + "视角的成员卡");
    const img = el("img"); img.src = DATA.avatars[msg.from] || ""; img.alt = ""; a.appendChild(img);
    a.addEventListener("click", () => openProfile(msg.from)); node.appendChild(a); }
  const body = el("div", "body");
  const meta = el("div", "meta");
  if (!mine) {
    meta.appendChild(el("span", "name", who(msg.from)));
    meta.appendChild(el("span", "badge", "AI视角"));
    if (msg.kind !== "say") meta.appendChild(el("span", "kind", DATA.kinds[msg.kind] || ""));
  }
  meta.appendChild(el("time", "", hhmm(msg.at)));
  body.appendChild(meta);
  const bubble = el("div", "bubble");
  const q = quoteBlock(msg); if (q) bubble.appendChild(q);
  bubble.appendChild(rich(msg.text, msg.from));
  body.appendChild(bubble);
  if (!mine) {
    if ((msg.cards || []).length) body.appendChild(chipRow(msg));
    else if (msg.kind !== "question") body.appendChild(el("div", "basis", "当前分析"));
  }
  if (LIVE) {
    const r = el("button", "replybtn", "回复"); r.type = "button";
    r.addEventListener("click", () => setReply(msg)); meta.appendChild(r);
  }
  node.appendChild(body);
  return node;
}

function renderPass(msg) {
  const node = el("div", "msg pass");
  node.appendChild(face(msg.from));
  node.appendChild(el("span", "", who(msg.from) + "视角：" + msg.text));
  return node;
}

function renderHost(msg) {
  if (msg.kind === "system") return el("div", "msg system", msg.text);
  const node = el("article", "msg host");
  const card = el("div", "card" + (msg.kind === "decision" ? " decision" : ""));
  const head = el("header"); head.appendChild(face("council"));
  head.appendChild(el("b", "", DATA.kinds[msg.kind] && msg.kind !== "say" ? DATA.kinds[msg.kind] : "主持人"));
  head.appendChild(el("span", "", msg.kind === "say" ? "" : "主持人"));
  head.appendChild(el("time", "", hhmm(msg.at)));
  card.appendChild(head);
  const inner = el("div", "inner");
  const q = quoteBlock(msg); if (q) inner.appendChild(q);
  inner.appendChild(rich(msg.text, "host"));
  if (msg.decision) {
    const dl = el("dl", "fields");
    for (const [key, label] of Object.entries(DATA.decision_fields)) {
      if (!msg.decision[key]) continue;
      const row = el("div"); row.appendChild(el("dt", "", label));
      const dd = el("dd"); dd.appendChild(rich(msg.decision[key], "host")); row.appendChild(dd); dl.appendChild(row);
    }
    inner.appendChild(dl);
  }
  if ((msg.cards || []).length) { const chips = chipRow(msg); chips.style.marginTop = "10px"; inner.appendChild(chips); }
  card.appendChild(inner); node.appendChild(card);
  return node;
}

/* ---------- stream ---------- */
const stream = $("stream"), col = $("col");
function nearBottom() { return stream.scrollHeight - stream.scrollTop - stream.clientHeight < 140; }
function toBottom(force) { if (force || nearBottom()) stream.scrollTop = stream.scrollHeight; }
function put(msg, animate) {
  const stick = nearBottom();
  for (const node of render(msg)) { if (animate) node.classList.add("enter"); col.insertBefore(node, typingNode.parentNode === col ? typingNode : null); }
  lastId = Math.max(lastId, msg.id);
  if (stick || msg.from === "user") toBottom(true);
  else { unseen += 1; $("newpill").textContent = `↓ ${unseen} 条新消息`; $("newpill").hidden = false; }
  refreshSide();
}
stream.addEventListener("scroll", () => { if (nearBottom()) { unseen = 0; $("newpill").hidden = true; } });
$("newpill").addEventListener("click", () => { toBottom(true); });

const typingNode = el("div", "typing");
function showTyping(slug, label) {
  typingNode.textContent = "";
  if (slug) typingNode.appendChild(face(slug === "host" ? "council" : slug));
  typingNode.appendChild(document.createTextNode(label));
  const dots = el("span", "dots"); dots.append(el("i"), el("i"), el("i")); typingNode.appendChild(dots);
  if (typingNode.parentNode !== col) col.appendChild(typingNode);
  toBottom();
}
function hideTyping() { if (typingNode.parentNode === col) col.removeChild(typingNode); }

function drain() {
  if (draining) return; draining = true;
  const step = () => {
    const msg = queue.shift();
    if (!msg) { draining = false; hideTyping(); updateStatus(); return; }
    if (reduced || msg.from === "user" || msg.kind === "system") { put(msg, false); return step(); }
    showTyping(msg.from, (msg.from === "host" ? "主持人" : who(msg.from)) + " 正在输入");
    setTimeout(() => { hideTyping(); put(msg, true); setTimeout(step, 260); }, Math.min(1500, 420 + msg.text.length * 6));
  };
  step();
}

/* ---------- side panel, profile, card drawer ---------- */
function refreshSide() {
  const members = $("members"); members.textContent = "";
  const counts = new Map(); const used = new Map(); const passed = new Set();
  for (const m of byId.values()) {
    if (seats.has(m.from) && m.kind === "pass") passed.add(m.from);
    if (!seats.has(m.from) || m.kind === "pass") continue;
    counts.set(m.from, (counts.get(m.from) || 0) + 1);
    for (const c of m.cards || []) { if (!used.has(m.from)) used.set(m.from, new Set()); used.get(m.from).add(c); }
  }
  for (const s of seats.values()) {
    const b = el("button", "member" + (counts.get(s.slug) ? "" : " silent")); b.type = "button"; b.style.setProperty("--hue", s.color);
    b.appendChild(face(s.slug));
    const w = el("div", "who"); const top = el("div"); top.appendChild(document.createTextNode(s.name)); top.appendChild(el("span", "badge", "AI视角"));
    w.appendChild(top); w.appendChild(el("div", "lens", s.lens)); b.appendChild(w);
    b.appendChild(el("span", "count", counts.get(s.slug) ? `${counts.get(s.slug)}条·${(used.get(s.slug) || new Set()).size}卡` : passed.has(s.slug) ? "本题未覆盖" : "未发言"));
    b.addEventListener("click", () => openProfile(s.slug)); members.appendChild(b);
  }
  const list = $("cardlist"); list.textContent = "";
  const cited = new Set(); for (const m of byId.values()) { for (const c of m.cards || []) cited.add(c); (m.text.match(new RegExp(ID_RE.source, "g")) || []).forEach((c) => { if (cards[c] && m.from !== "user") cited.add(c); }); }
  if (!cited.size) list.appendChild(el("div", "empty", "还没有使用方法卡。"));
  for (const id of [...cited].sort()) {
    const c = cards[id]; if (!c) continue;
    const b = el("button"); b.type = "button"; b.style.setProperty("--hue", hue(c.person));
    b.appendChild(el("span", "inline-id", id)); b.appendChild(el("span", "ct", c.title || "")); b.addEventListener("click", () => openCard(id)); list.appendChild(b);
  }
  const sub = $("sub"); sub.textContent = "";
  sub.appendChild(el("span", "", DATA.chat.mode === "direct" ? "单聊" : `${seats.size} 位顾问视角`));
  sub.appendChild(el("span", "tag" + (DATA.chat.simulated ? " sim" : ""), DATA.chat.simulated ? "模拟案例" : "真实决策"));
  if (LIVE) sub.appendChild(el("span", "tag " + (presence === "offline" ? "away" : "live"), presence === "offline" ? "顾问团暂离" : "顾问团在线"));
  else sub.appendChild(el("span", "tag", "聊天记录"));
}

function openSheet(build) {
  const sheet = $("sheet"); sheet.textContent = "";
  const close = el("button", "close", "关闭"); close.type = "button"; close.addEventListener("click", closeSheet); sheet.appendChild(close);
  build(sheet); $("scrim").hidden = false; close.focus();
}
function closeSheet() { $("scrim").hidden = true; }
$("scrim").addEventListener("click", (e) => { if (e.target === $("scrim")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeSheet(); $("side").classList.remove("open"); hideMenu(); } });

const KIND_NAME = {principle: "方法卡", method: "方法卡"};
function listBlock(sheet, title, items) {
  if (!items || !items.length) return;
  sheet.appendChild(el("h4", "", title)); const ul = el("ul");
  for (const item of [].concat(items)) ul.appendChild(el("li", "", item)); sheet.appendChild(ul);
}
function openCard(id) {
  const c = cards[id]; if (!c) return;
  openSheet((sheet) => {
    sheet.style.setProperty("--hue", hue(c.person));
    const line = el("div", "idline"); line.appendChild(el("code", "", c.id));
    line.appendChild(el("span", "", `${c.person_name || ""} · ${KIND_NAME[c.kind] || c.kind}`));
    sheet.appendChild(line);
    sheet.appendChild(el("h3", "", c.title || ""));
    if (c.summary) sheet.appendChild(el("div", "claim", c.summary));
    listBlock(sheet, "适用条件", c.conditions);
    listBlock(sheet, "边界", c.boundaries);
    listBlock(sheet, "检查问题", c.questions);
    listBlock(sheet, "建议动作", c.actions);
    sheet.appendChild(el("p", "foot", "这是整理后的决策方法，不是本人原话或原文引证。本发行版不含来源资料。"));
  });
}
function openProfile(slug) {
  const s = seats.get(slug); if (!s) return;
  openSheet((sheet) => {
    sheet.style.setProperty("--hue", s.color);
    const box = el("div", "profile"); box.appendChild(face(slug, "", true));
    const h = el("h3"); h.appendChild(document.createTextNode(s.name + " ")); h.appendChild(el("span", "badge", "AI视角")); box.appendChild(h);
    box.appendChild(el("div", "lensline", "常见检索方向：" + s.lens)); sheet.appendChild(box);
    const mine = [...byId.values()].filter((m) => m.from === slug);
    const used = new Set(); mine.forEach((m) => (m.cards || []).forEach((c) => used.add(c)));
    sheet.appendChild(el("h4", "", "在本群"));
    sheet.appendChild(el("div", "", mine.length ? `发言 ${mine.filter((m) => m.kind !== "pass").length} 条，引用 ${used.size} 张方法卡。` : "还没有发言。"));
    if (used.size) { const list = el("div", "cardlist"); list.style.marginTop = "8px";
      for (const id of [...used].sort()) { const b = el("button"); b.type = "button"; b.appendChild(el("span", "inline-id", id)); b.appendChild(el("span", "ct", (cards[id] || {}).title || "")); b.addEventListener("click", () => openCard(id)); list.appendChild(b); }
      sheet.appendChild(list); }
    if (LIVE) { const at = el("button", "barbtn", "@" + s.name + " 问一句"); at.type = "button"; at.style.marginTop = "16px";
      at.addEventListener("click", () => { closeSheet(); insertMention(s.name); }); sheet.appendChild(at); }
    sheet.appendChild(el("p", "foot", "这是受" + s.name + "方法启发的 AI 分析席位，不是本人，不代表本人认可。头像为 Q 版示意，不是本人肖像。"));
  });
}

/* ---------- composer (live only) ---------- */
const input = $("input");
let sending = false;
function updateStatus() {
  if (!LIVE) return;
  const status = $("status"); const mineLast = [...byId.values()].pop();
  const online = presence !== "offline";
  status.className = "status " + (online ? "on" : "off");
  $("statusText").textContent = failures > 3 ? "群聊室已离线。回到对话里让顾问团重新打开。"
    : presence === "thinking" ? (mineLast && mineLast.from === "user" ? "顾问们收到了，正在准备回复。" : "顾问们刚回复完，想接着聊就直接说。")
    : online ? "顾问团在线，发言后他们会在这里回复。" : "顾问团暂时不在线：回到 Claude / Codex 的对话里说一声“回群里”，他们会接着聊。你现在发的话会留在群里。";
  if (online && mineLast && mineLast.from === "user" && !queue.length && !draining) showTyping("council", presence === "thinking" ? "顾问们正在准备回复" : "顾问们正在看你的消息");
  else if (!draining) hideTyping();
}
function setReply(msg) {
  replyTo = msg.id; $("replybar").hidden = false; $("replybar").style.setProperty("--qhue", hue(msg.from) || "currentColor");
  $("replyText").textContent = "回复 " + who(msg.from) + "：" + snippet(msg.text, 40);
  if (seats.has(msg.from) && !input.value.includes("@" + who(msg.from))) insertMention(who(msg.from)); else input.focus();
}
$("replyCancel").addEventListener("click", () => { replyTo = null; $("replybar").hidden = true; });
function insertMention(name) {
  const at = input.selectionStart, v = input.value;
  const before = v.slice(0, at).replace(/@[^\s@]*$/, ""), after = v.slice(at);
  input.value = before + "@" + name + " " + after; const pos = (before + "@" + name + " ").length;
  input.focus(); input.setSelectionRange(pos, pos); hideMenu(); grow();
}
function grow() { input.style.height = "auto"; const h = input.scrollHeight + 2; input.style.height = Math.min(160, h) + "px"; input.style.overflowY = h > 160 ? "auto" : "hidden"; $("send").disabled = sending || !input.value.trim(); }
let menuIndex = 0;
function hideMenu() { $("menu").hidden = true; }
function showMenu(filter) {
  const menu = $("menu"); menu.textContent = "";
  const options = [...seats.values()].filter((s) => s.name.startsWith(filter)).map((s) => ({label: s.name, slug: s.slug, note: s.lens}));
  if ("所有人".startsWith(filter) && seats.size > 1) options.push({label: "所有人", slug: "council", note: "请每位相关的顾问都说一句"});
  if (!options.length) return hideMenu();
  menuIndex = Math.min(menuIndex, options.length - 1);
  options.forEach((o, i) => { const b = el("button"); b.type = "button"; b.setAttribute("role", "option"); b.setAttribute("aria-selected", i === menuIndex ? "true" : "false");
    b.appendChild(face(o.slug)); b.appendChild(el("span", "", o.label)); b.appendChild(el("small", "", snippet(o.note, 14)));
    b.addEventListener("mousedown", (e) => { e.preventDefault(); insertMention(o.label); }); menu.appendChild(b); });
  menu.hidden = false; menu._options = options;
}
input.addEventListener("input", () => {
  grow(); const m = /@([^\s@]*)$/.exec(input.value.slice(0, input.selectionStart));
  if (m) showMenu(m[1]); else hideMenu();
});
input.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  const menu = $("menu");
  if (!menu.hidden) {
    const n = menu._options.length;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); menuIndex = (menuIndex + (e.key === "ArrowDown" ? 1 : n - 1)) % n; return showMenu(/@([^\s@]*)$/.exec(input.value.slice(0, input.selectionStart))[1]); }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); return insertMention(menu._options[menuIndex].label); }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("send").addEventListener("click", sendMessage);
async function sendMessage() {
  if (sending || !LIVE) return;
  const draft = input.value, text = draft.trim(), target = replyTo;
  if (!text) return;
  sending = true;
  const button = $("send"), label = button.textContent;
  button.textContent = "发送中…"; grow();
  try {
    const res = await fetch("/api/say", {method: "POST", headers: {"Content-Type": "application/json", "X-Room-Token": LIVE.token}, body: JSON.stringify({text, reply_to: target})});
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "发送失败");
    // Only clear the draft we sent. Edits and a newly selected reply belong to the next message.
    if (input.value === draft && replyTo === target) {
      input.value = ""; replyTo = null; $("replybar").hidden = true;
    }
    poll();
  } catch (err) { $("status").className = "status off"; $("statusText").textContent = "没发出去：" + err.message;
  } finally { sending = false; button.textContent = label; grow(); }
}
function updateDepth(info) {
  DATA.chat.depth = info.depth;
  DATA.chat.depth_label = info.depth_label || "深度未记录";
  DATA.chat.depth_history = info.depth_history || [];
  $("depthBadge").textContent = "讨论深度 · " + DATA.chat.depth_label;
}
function openDepth() {
  openSheet(sheet => {
    sheet.appendChild(el("h3", "", "讨论深度 · " + DATA.chat.depth_label));
    sheet.appendChild(el("p", "", "可选档位：极速、低、中、高、极高。档位约定讨论投入和交锋深度，不是模型推理等级，也不保证结论正确。"));
    sheet.appendChild(el("p", "", "在主对话选择或切换讨论深度，本页不启动模型。切换只影响后续讨论，已有发言不会重写。"));
    if (!DATA.chat.depth) sheet.appendChild(el("p", "", "这份旧记录没有保存讨论深度，不能推断为新版任一档位。"));
    if (DATA.chat.depth_history.length) sheet.appendChild(el("p", "", "深度变更已保存在群聊系统消息中。"));
  });
}
async function poll() {
  try {
    const res = await fetch(`/api/chat?since=${seenId}`, {headers: {"X-Room-Token": LIVE.token}});
    if (!res.ok) throw new Error(res.status);
    const body = await res.json(); failures = 0;
    Object.assign(cards, body.cards || {});
    updateDepth(body);
    for (const m of body.messages) if (m.id > seenId) { seenId = m.id; queue.push(m); }  // seenId, not lastId: a message being "typed" is in neither list
    if (presence !== body.presence) { presence = body.presence; refreshSide(); }
    if (queue.length) drain(); else updateStatus();
  } catch (err) { failures += 1; if (failures > 3) { presence = "offline"; refreshSide(); updateStatus(); } }
}

/* ---------- boot ---------- */
function boot() {
  if (!DATA) { document.body.textContent = "这是群聊室模板；用 chatroom.py render 或 serve 生成页面。"; return; }
  document.title = (DATA.chat.mode === "direct" ? [...seats.values()][0].name + "视角" : "产品顾问团") + " · " + DATA.chat.topic;
  $("title").textContent = (DATA.chat.mode === "direct" ? [...seats.values()][0].name + "视角 · " : "产品顾问团 · ") + DATA.chat.topic;
  updateDepth(DATA.chat);
  $("depthBadge").addEventListener("click", openDepth);
  $("groupFace").appendChild(DATA.chat.mode === "direct" ? face([...seats.keys()][0]) : face("council"));
  if (DATA.chat.mode === "direct") $("groupFace").style.borderRadius = "50%";
  for (const s of seats.values()) { const f = face(s.slug); f.title = s.name + "视角"; $("stack").appendChild(f); }
  $("noticeText").textContent = DATA.notice;
  $("noticeBtn").addEventListener("click", () => { const folded = $("notice").classList.toggle("folded"); $("noticeBtn").textContent = folded ? "展开" : "收起"; $("noticeBtn").setAttribute("aria-expanded", String(!folded)); });
  $("membersBtn").addEventListener("click", () => $("side").classList.toggle("open"));
  $("sideClose").addEventListener("click", () => $("side").classList.remove("open"));
  stream.addEventListener("click", () => $("side").classList.remove("open"));
  for (const m of DATA.messages) { put(m, false); seenId = Math.max(seenId, m.id); }
  refreshSide(); toBottom(true);
  if (LIVE) {
    $("composer").hidden = false;
    const quick = $("quick");
    for (const text of ["你们继续聊", "@所有人 最强的反例是什么？", "收个尾，给我决议卡"]) { const b = el("button", "", text); b.type = "button"; b.addEventListener("click", () => { input.value = text; grow(); input.focus(); }); quick.appendChild(b); }
    if (window.matchMedia("(max-width:640px)").matches) input.placeholder = "说点什么…  @ 点名顾问";
    else input.focus();
    updateStatus(); poll(); setInterval(poll, LIVE.poll_ms || 1500);
  } else {
    $("staticNote").hidden = false;
    $("staticNote").appendChild(el("span", "", "这是一份聊天记录。要继续讨论，回到 Claude / Codex 的对话里接着说。"));
    if (!reduced && DATA.messages.length > 1) { $("replayBtn").hidden = false; $("replayBtn").addEventListener("click", replay); }
  }
  requestAnimationFrame(() => toBottom(true));
}
function replay() {
  if (draining) return;
  col.textContent = ""; byId.clear(); lastId = 0; lastDay = ""; unseen = 0; queue = DATA.messages.slice(); refreshSide(); drain();
}
boot();
</script>
<script>/*__EXPORT_JS__*/</script>
</body>
</html>
